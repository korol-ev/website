<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#07131b">
<title>KOROL — Electric Mobility & Charging</title>
<meta name="description" content="KOROL builds connected electric mobility and charging infrastructure for a cleaner, simpler future.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Outfit:wght@500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#07131b; --ink2:#0c2029; --ink3:#112a33;
  --green:#39f59a; --green2:#22d97c; --mint:#a6ffd0;
  --paper:#f5f8f7; --paper2:#eef3f1;
  --line:rgba(255,255,255,.12); --line-soft:#dce6e3;
  --txt:#101d26; --txt-2:#63747b; --txt-3:#82979f;
  --dark-txt:#fff; --dark-txt-2:#a7bbc3;
  --display:'Outfit',sans-serif; --body:'Inter',sans-serif;
  --r:14px; --r-lg:20px; --r-xl:24px;
  --max:1180px; --nav-h:76px;
  --ease:cubic-bezier(.22,.61,.36,1);
  --base-size:16px; --heading-scale:1; --heading-weight:800; --heading-tracking:-.04em;
  --section-pad:82px; --container-pad:4%; --card-pad:26px; --grid-gap:18px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%;font-size:var(--base-size)}
body{font-family:var(--body);background:var(--paper);color:var(--txt);line-height:1.6;-webkit-font-smoothing:antialiased;overflow-x:hidden}
img,svg{display:block;max-width:100%}
a{color:inherit;text-decoration:none}
button,input,textarea,select{font:inherit;color:inherit;background:none;border:0}
ul{list-style:none}
.page{display:none}
.page.active{display:block;animation:fade .35s var(--ease)}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes partnersSlide{from{transform:translateX(0)}to{transform:translateX(-50%)}}
.container{width:min(var(--max), 92%);margin:0 auto;padding:0 0}
.section{padding:var(--section-pad) 0;background:var(--paper)}
.section--alt{background:var(--paper2)}
.section--dark{background:var(--ink);color:var(--dark-txt)}
.section--dark .sub{color:var(--dark-txt-2)}
.section-head{display:flex;align-items:end;justify-content:space-between;gap:24px;margin-bottom:38px;flex-wrap:wrap}
.section-head > div{max-width:640px}
.sub{color:var(--txt-2);line-height:1.7;max-width:620px}
h1,h2,h3,h4{font-family:var(--display);letter-spacing:var(--heading-tracking);line-height:1.08;font-weight:var(--heading-weight)}
h1{font-size:calc(clamp(2.7rem,5.5vw,5.1rem) * var(--heading-scale));letter-spacing:-.055em;line-height:.98}
h2{font-size:calc(clamp(1.9rem,3.6vw,3rem) * var(--heading-scale));letter-spacing:-.04em;margin:12px 0}
h3{font-size:1.22rem;letter-spacing:-.02em;margin-bottom:8px}
h4{font-size:1rem;letter-spacing:-.01em;margin-bottom:10px}
h1 span,h2 span{color:var(--green)}
.eyebrow{font-size:.76rem;letter-spacing:.18em;text-transform:uppercase;color:var(--green);font-weight:800;display:inline-block;margin-bottom:6px}
.section--dark .eyebrow{color:var(--green)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;border:0;border-radius:999px;padding:13px 22px;background:var(--green);color:#052015;font-weight:800;font-size:.9rem;cursor:pointer;transition:.2s var(--ease);white-space:nowrap;border:1px solid transparent}
.btn:hover{transform:translateY(-2px);filter:brightness(1.05)}
.btn--outline{background:transparent;border-color:rgba(255,255,255,.35);color:#fff}
.btn--outline:hover{background:rgba(255,255,255,.08);border-color:var(--green);color:var(--green)}
.btn--dark{background:var(--ink);color:#fff}
.btn--dark:hover{background:var(--ink2)}
.btn--ghost{border:1px solid #c9d6d1;color:var(--txt);background:#fff}
.btn--ghost:hover{border-color:var(--green);color:var(--green2)}
.btn--lg{padding:15px 26px;font-size:.95rem}
.btn--block{width:100%}
.btn-group{display:flex;gap:12px;flex-wrap:wrap}

/* ============ NAV ============ */
.nav{position:sticky;top:0;z-index:100;background:rgba(5,17,25,.94);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);color:#fff;border-bottom:1px solid var(--line)}
.nav__inner{height:var(--nav-h);display:flex;align-items:center;justify-content:space-between;gap:22px;width:min(var(--max),92%);margin:0 auto}
.logo{font-family:var(--display);font-weight:900;letter-spacing:.22em;font-size:1.25rem;white-space:nowrap;color:#fff;display:flex;align-items:center;gap:4px;cursor:pointer}
.logo b{color:var(--green);font-weight:900}
.logo img{height:44px;max-width:180px;object-fit:contain;display:block}
.nav__links{display:flex;gap:24px;align-items:center;font-size:.9rem;color:#d8e3e8}
.nav__link{color:#d8e3e8;cursor:pointer;transition:color .2s;background:none;border:0;padding:0;font:inherit}
.nav__link:hover{color:var(--green)}
.nav__link.is-active{color:var(--green)}
.menu-btn{display:none;background:none;color:#fff;border:1px solid #52636a;border-radius:10px;padding:8px 11px;cursor:pointer;font-size:1.1rem}
.drawer{position:fixed;top:var(--nav-h);left:0;right:0;z-index:99;background:#07131b;padding:22px;flex-direction:column;align-items:flex-start;gap:14px;display:none}
.drawer.is-open{display:flex}
.drawer .nav__link{font-size:1.05rem}
.drawer .btn{margin-top:8px}

/* ============ HERO ============ */
.hero{position:relative;isolation:isolate;overflow:hidden;min-height:600px;color:#fff;background:var(--ink) center/cover no-repeat;display:flex;align-items:center}
.hero::before{content:'';position:absolute;inset:0;background:linear-gradient(90deg,rgba(4,17,25,.96) 0%,rgba(4,17,25,.78) 46%,rgba(4,17,25,.35) 100%);z-index:1}
.hero::after{content:"";position:absolute;inset:auto 0 0;height:160px;background:linear-gradient(transparent,var(--ink));z-index:1}
.hero__inner{position:relative;z-index:2;padding:100px 0;max-width:680px}
.hero__eyebrow{font-size:.78rem;letter-spacing:.18em;text-transform:uppercase;color:var(--green);font-weight:900}
.hero h1{margin:18px 0 20px}
.hero p{font-size:1.08rem;line-height:1.7;color:#d5e1e6;max-width:580px}
.hero__actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:30px}

/* ============ STATS BAR ============ */
.stats-bar{background:#dce6e3;border-bottom:1px solid #dce6e3}
.stats-bar__grid{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:#dce6e3;width:100%}
.stat{background:#fff;padding:26px 20px;text-align:center}
.stat strong{display:block;font-family:var(--display);font-size:1.35rem;color:#10242b;margin-bottom:3px}
.stat span{color:#63747b;font-size:.86rem}

/* ============ PARTNERS STRIP ============ */
.partners-strip{padding:44px 0;background:#fff;border-bottom:1px solid var(--line-soft)}
.partners-strip .section-head{margin-bottom:22px;text-align:center;justify-content:center}
.partners-strip .eyebrow{color:var(--green2)}
.partners-strip h2{font-size:1.35rem;letter-spacing:-.02em;margin:0;color:var(--txt-2);font-weight:700}
.partners-marquee{position:relative;overflow:hidden;-webkit-mask-image:linear-gradient(to right,transparent,#000 10%,#000 90%,transparent);mask-image:linear-gradient(to right,transparent,#000 10%,#000 90%,transparent)}
.partners-marquee__track{display:flex;width:max-content;align-items:center;gap:64px;animation:partnersSlide 40s linear infinite;padding:6px 0}
.partners-marquee:hover .partners-marquee__track{animation-play-state:paused}
.partner-logo{flex-shrink:0;height:56px;display:flex;align-items:center;justify-content:center;opacity:.55;filter:grayscale(100%);transition:opacity .35s var(--ease),filter .35s var(--ease),transform .35s var(--ease);text-decoration:none}
.partner-logo:hover{opacity:1;filter:grayscale(0%);transform:scale(1.05)}
.partner-logo img{max-height:56px;max-width:160px;width:auto;height:auto;object-fit:contain;display:block}
.partner-logo__name{font-family:var(--display);font-size:1.05rem;font-weight:800;letter-spacing:.06em;color:var(--txt-2);white-space:nowrap;text-transform:uppercase}

/* ============ FEATURES ============ */
.features-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:var(--grid-gap);margin-top:8px}
.feat-card{background:#fff;border:1px solid var(--line-soft);border-radius:var(--r-lg);padding:var(--card-pad);transition:.25s var(--ease);overflow:hidden}
.feat-card:hover{transform:translateY(-4px);box-shadow:0 18px 40px rgba(10,42,32,.08)}
.feat-card__img{border-radius:12px;overflow:hidden;margin-bottom:18px}
.feat-card__img img{width:100%;height:140px;object-fit:cover;display:block}
.feat-card__icon{font-size:1.6rem;color:var(--green);margin-bottom:14px;font-weight:900;line-height:1}
.feat-card h3{color:var(--txt);margin-bottom:8px}
.feat-card p{color:var(--txt-2);font-size:.9rem;line-height:1.6}

/* ============ VEHICLES ============ */
.vehicles-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--grid-gap)}
.vehicle{background:#fff;border:1px solid var(--line-soft);border-radius:var(--r-lg);overflow:hidden;transition:.25s var(--ease)}
.vehicle:hover{transform:translateY(-5px);box-shadow:0 18px 40px rgba(10,42,32,.08)}
.vehicle__art{height:180px;display:grid;place-items:center;position:relative;overflow:hidden;background:radial-gradient(ellipse at 50% 100%, #b5d4c6, #eff5f2 65%)}
.vehicle__art img{width:100%;height:100%;object-fit:cover}
.vehicle__symbol{font-size:4.5rem;filter:drop-shadow(0 16px 8px rgba(26,48,43,.18))}
.vehicle__body{padding:22px}
.vehicle__body h3{margin:0 0 8px}
.vehicle__body p{color:var(--txt-2);font-size:.92rem;line-height:1.55;margin-bottom:12px}
.tag{display:inline-block;border-radius:99px;padding:6px 12px;background:#e6fff1;color:#13794b;font-size:.72rem;font-weight:800;letter-spacing:.04em;text-transform:uppercase}

/* ============ CHARGING SOLUTIONS ============ */
.charging-grid{display:grid;grid-template-columns:1fr 1fr;gap:var(--grid-gap);margin-top:30px}
.charge-card{border:1px solid #28434b;background:linear-gradient(140deg,#112a33,#091820);border-radius:var(--r-lg);padding:30px;min-height:230px}
.charge-card__icon{font-size:1.9rem;color:var(--green);font-weight:900;line-height:1;margin-bottom:16px}
.charge-card h3{font-size:1.45rem;margin-bottom:10px;color:#fff}
.charge-card p{color:#adc0c6;line-height:1.65;font-size:.94rem;margin-bottom:14px}
.charge-card a{color:var(--green);font-weight:800;font-size:.9rem}

/* ============ APP SHOWCASE ============ */
.app-grid{display:grid;grid-template-columns:.85fr 1.15fr;align-items:center;gap:60px}
.phone{width:min(300px,100%);margin:auto;border:8px solid #10222b;border-radius:36px;background:#fff;min-height:500px;padding:20px;box-shadow:0 28px 60px rgba(0,27,32,.18)}
.phone__top{height:8px;width:65px;border-radius:99px;background:#10222b;margin:0 auto 22px}
.phone h3{font-size:1.15rem;margin-bottom:6px}
.phone__desc{font-size:.88rem;color:var(--txt-2);margin-bottom:14px}
.app-map{height:180px;border-radius:15px;background:linear-gradient(30deg,#dceee4,#f2f7f3);position:relative;overflow:hidden}
.app-map::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(40deg,transparent 0 22px,#b8d2c4 23px 25px),repeating-linear-gradient(120deg,transparent 0 35px,#c7ded2 36px 38px)}
.app-pin{position:absolute;top:43%;left:52%;font-size:1.6rem}
.phone__station{margin-top:16px;font-weight:800}
.phone__station-type{font-size:.82rem;color:var(--txt-2);margin-bottom:14px}
.phone__btn{margin-top:8px;background:var(--green);text-align:center;border-radius:10px;padding:13px;font-weight:800;color:#052015;cursor:pointer;transition:.2s var(--ease)}
.phone__btn:hover{filter:brightness(1.05)}
.app-benefits{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:28px}
.benefit{display:flex;gap:12px;align-items:flex-start}
.benefit__check{background:#dfffee;color:#078449;border-radius:10px;padding:8px 10px;font-weight:900;flex-shrink:0}
.benefit p{margin:0;color:var(--txt-2);line-height:1.55;font-size:.92rem}
.benefit strong{color:var(--txt);display:block;margin-bottom:2px}

/* ============ TECHNOLOGY ============ */
.tech-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--grid-gap);margin-top:8px}
.tech-card{background:#fff;border:1px solid var(--line-soft);border-radius:var(--r-lg);padding:var(--card-pad)}
.tech-card h3{margin:10px 0 8px}
.tech-card p{color:var(--txt-2);font-size:.92rem;line-height:1.6}

/* ============ TESTIMONIALS ============ */
.testimonials-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--grid-gap);margin-top:8px}
.quote{background:#fff;border:1px solid var(--line-soft);border-radius:var(--r-lg);padding:var(--card-pad);transition:.25s var(--ease)}
.quote:hover{transform:translateY(-4px);box-shadow:0 18px 40px rgba(10,42,32,.08)}
.quote p{font-size:.94rem;color:var(--txt-2);line-height:1.72;margin-bottom:20px}
.quote__who{display:flex;align-items:center;gap:12px}
.avatar{width:42px;height:42px;border-radius:50%;flex-shrink:0;background:var(--green);color:#052015;display:grid;place-items:center;font-weight:800;font-size:.85rem;overflow:hidden}
.avatar img{width:100%;height:100%;object-fit:cover;border-radius:50%}
.quote__name{font-size:.88rem;font-weight:800;display:block;color:var(--txt)}
.quote__role{font-size:.76rem;color:var(--txt-3)}

/* ============ CTA BAND ============ */
.cta-band{position:relative;padding:var(--section-pad) 0;background:var(--ink);color:#fff;overflow:hidden}
.cta-band::before{content:'';position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:700px;height:700px;pointer-events:none;background:radial-gradient(circle, rgba(57,245,154,.14), transparent 65%);z-index:1}
.cta-band__inner{position:relative;z-index:2;text-align:center}
.cta-band h2{max-width:760px;margin:12px auto 20px}
.cta-band p{max-width:520px;margin:0 auto 34px;color:var(--dark-txt-2)}
.cta-band .btn-group{justify-content:center}

/* ============ FOOTER ============ */
.footer{background:#061119;color:#d4e0e4;padding:60px 0 26px}
.footer__grid{display:grid;grid-template-columns:1.5fr 1fr 1fr 1fr;gap:32px}
.footer h4{color:#fff;margin-bottom:16px;font-size:.94rem;letter-spacing:.02em}
.footer a{display:block;color:#9bb0b9;margin:10px 0;font-size:.88rem;transition:color .2s}
.footer a:hover{color:var(--green)}
.footer .logo{margin-bottom:14px;font-size:1.15rem}
.footer__desc{color:#92a7b0;line-height:1.65;max-width:280px;font-size:.9rem}
.socials{display:flex;gap:10px;margin-top:16px}
.socials a{display:grid;place-items:center;width:36px;height:36px;border-radius:10px;border:1px solid rgba(255,255,255,.14);color:#c0d0d6;font-weight:800;font-size:.72rem;transition:.2s;margin:0}
.socials a:hover{border-color:var(--green);color:var(--green);background:rgba(57,245,154,.08)}
.footer__bottom{border-top:1px solid #243b43;margin-top:42px;padding-top:22px;color:#82979f;font-size:.82rem;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}

/* ============ LOADING ============ */
.site-loading{position:fixed;inset:0;background:var(--paper);display:grid;place-items:center;z-index:9999;transition:opacity .35s var(--ease);text-align:center;padding:40px}
body.content-loaded .site-loading{opacity:0;pointer-events:none}
.site-loading__logo{font-family:var(--display);font-size:1.5rem;font-weight:900;letter-spacing:.22em;margin-bottom:28px;color:var(--ink)}
.site-loading__logo b{color:var(--green)}
.site-loading__spinner{width:36px;height:36px;border:3px solid #d4e0dc;border-top-color:var(--green);border-radius:50%;margin:0 auto 20px;animation:spin 1s linear infinite}
.site-loading__msg{color:var(--txt-2);font-size:.9rem}
.site-loading__error{background:#fff;border:1px solid rgba(255,95,87,.3);border-radius:12px;padding:22px;margin-top:24px;text-align:left;color:var(--txt-2);font-size:.85rem;line-height:1.65;max-width:520px}
.site-loading__error strong{color:#d63b30;display:block;margin-bottom:8px}
.site-loading__error code{font-family:ui-monospace,monospace;font-size:.78rem;background:#f2f7f3;padding:2px 6px;border-radius:4px;color:var(--green2)}

/* ============ CUSTOM SECTIONS ============ */
.custom-sections .section{background:var(--paper)}
.custom-sections .section--alt{background:var(--paper2)}
.custom-sections .section--dark{background:var(--ink);color:#fff}

/* ============ RESPONSIVE ============ */
@media (max-width:1024px){
  .features-grid{grid-template-columns:repeat(2,1fr)}
  .testimonials-grid{grid-template-columns:repeat(2,1fr)}
  .tech-grid{grid-template-columns:1fr 1fr}
}
@media (max-width:900px){
  .nav__links{display:none}
  .menu-btn{display:block}
  .nav__inner>.btn{display:none}
  .app-grid{grid-template-columns:1fr;gap:44px}
  .charging-grid{grid-template-columns:1fr}
  .vehicles-grid{grid-template-columns:repeat(2,1fr)}
  .hero{min-height:520px}
  .hero__inner{padding:80px 0}
  .stats-bar__grid{grid-template-columns:repeat(2,1fr)}
  .footer__grid{grid-template-columns:1fr 1fr}
  h1{font-size:clamp(2.2rem,7vw,3.6rem)}
}
@media (max-width:560px){
  :root{--section-pad:58px}
  .section-head{flex-direction:column;align-items:flex-start}
  .vehicles-grid,.features-grid,.testimonials-grid,.tech-grid,.app-benefits{grid-template-columns:1fr}
  .stats-bar__grid{grid-template-columns:1fr 1fr}
  .stat{padding:20px 10px}
  .footer__grid{grid-template-columns:1fr 1fr}
  .footer__bottom{flex-direction:column}
  .logo{font-size:1.1rem}
  .logo img{height:36px;max-width:140px}
}
</style>
</head>
<body>

<div class="site-loading" id="siteLoading">
  <div>
    <div class="site-loading__logo"><b>K</b>OROL</div>
    <div class="site-loading__spinner" id="loadingSpinner"></div>
    <div class="site-loading__msg" id="loadingMsg">Loading site content…</div>
    <div id="loadingError" style="display:none"></div>
  </div>
</div>

<header class="nav">
  <div class="nav__inner">
    <div class="logo" data-nav="home" id="siteLogo"><b>K</b>OROL</div>
    <nav class="nav__links">
      <button class="nav__link is-active" data-nav="home">Home</button>
      <button class="nav__link" data-nav="vehicles">Our EVs</button>
      <button class="nav__link" data-nav="charging">Charging</button>
      <button class="nav__link" data-nav="business">Business</button>
      <button class="nav__link" data-nav="about">About Us</button>
    </nav>
    <button class="btn" data-nav="app">Explore the App ↗</button>
    <button class="menu-btn" id="menuBtn" aria-label="Menu">☰</button>
  </div>
</header>

<div class="drawer" id="navDrawer">
  <button class="nav__link" data-nav="home">Home</button>
  <button class="nav__link" data-nav="vehicles">Our EVs</button>
  <button class="nav__link" data-nav="charging">Charging</button>
  <button class="nav__link" data-nav="business">Business</button>
  <button class="nav__link" data-nav="about">About Us</button>
  <button class="btn" data-nav="app">Explore the App ↗</button>
</div>

<main>

<!-- ============ HOME ============ -->
<div class="page active" id="page-home">

  <section class="hero" id="hero-section">
    <div class="container">
      <div class="hero__inner">
        <span class="hero__eyebrow" data-content="home.hero.eyebrow"></span>
        <h1 data-content="home.hero.title"></h1>
        <p data-content="home.hero.subtitle"></p>
        <div class="hero__actions">
          <button class="btn btn--lg" data-nav="vehicles" data-content="home.hero.button1Label"></button>
          <button class="btn btn--lg btn--outline" data-nav="charging" data-content="home.hero.button2Label"></button>
        </div>
      </div>
    </div>
  </section>

  <section class="stats-bar" id="stats-section">
    <div class="stats-bar__grid" id="stats-grid"></div>
  </section>

  <section class="partners-strip" id="partners-section" style="display:none">
    <div class="container">
      <div class="section-head">
        <div style="text-align:center">
          <span class="eyebrow" data-content="home.partners.eyebrow"></span>
          <h2 data-content="home.partners.title"></h2>
        </div>
      </div>
    </div>
    <div class="partners-marquee">
      <div class="partners-marquee__track" id="partners-track"></div>
    </div>
  </section>

  <section class="section" id="features-section">
    <div class="container">
      <div class="section-head">
        <div>
          <span class="eyebrow" data-content="home.features.eyebrow"></span>
          <h2 data-content="home.features.title"></h2>
          <p class="sub" data-content="home.features.subtitle"></p>
        </div>
      </div>
      <div class="features-grid" id="features-grid"></div>
    </div>
  </section>

  <section class="section section--alt" id="vehicles-section">
    <div class="container">
      <div class="section-head">
        <div>
          <span class="eyebrow" data-content="home.vehicles.eyebrow"></span>

<script>
(function(){
  'use strict';
  document.getElementById('yr').textContent = new Date().getFullYear();

  const loadingSpinner = document.getElementById('loadingSpinner');
  const loadingMsg = document.getElementById('loadingMsg');
  const loadingError = document.getElementById('loadingError');

  function showError(msg, hint) {
    loadingSpinner.style.display = 'none';
    loadingMsg.textContent = 'Could not load site content.';
    loadingError.style.display = 'block';
    loadingError.innerHTML = '<div class="site-loading__error"><strong>' + msg + '</strong>' + (hint || '') + '</div>';
  }

  const CONTENT_SHAPE = {
    site:{brandName:"KOROL",brandTagline:"",logoUrl:""},
    home:{
      hero:{eyebrow:"",title:"",subtitle:"",bgImage:"",button1Label:"",button2Label:""},
      stats:[],
      partners:{eyebrow:"",title:"",items:[]},
      features:{eyebrow:"",title:"",subtitle:"",items:[]},
      vehicles:{eyebrow:"",title:"",subtitle:"",buttonLabel:"",items:[]},
      charging:{eyebrow:"",title:"",subtitle:"",items:[]},
      app:{eyebrow:"",title:"",subtitle:"",phoneEyebrow:"",phoneTitle:"",phoneDesc:"",phoneStation:"",phoneStationType:"",phoneButton:"",benefits:[]},
      technology:{eyebrow:"",title:"",items:[]},
      testimonials:{eyebrow:"",title:"",items:[]},
      cta:{eyebrow:"",title:"",subtitle:"",button1Label:"",button2Label:"",bgImage:""}
    },
    vehicles:{
      hero:{eyebrow:"",title:"",subtitle:"",items:[]},
      cta:{eyebrow:"",title:"",subtitle:""}
    },
    charging:{
      hero:{eyebrow:"",title:"",subtitle:"",items:[]},
      process:{eyebrow:"",title:"",items:[]},
      cta:{title:"",subtitle:""}
    },
    business:{
      hero:{eyebrow:"",title:"",subtitle:"",benefits:[]},
      form:{eyebrow:"",title:""}
    },
    about:{
      hero:{eyebrow:"",title:"",subtitle:"",values:[]},
      mission:{eyebrow:"",title:"",text:""}
    },
    app:{
      hero:{eyebrow:"",title:"",subtitle:"",benefits:[]}
    },
    footer:{
      brand:{name:"KOROL",tagline:"",socials:[],logoUrl:""},
      explore:{title:"",links:[]},
      company:{title:"",links:[]},
      contact:{title:"",links:[]},
      copyright:{name:"",legal:""}
    },
    typography:{baseSize:16,headingScale:1,headingWeight:800,headingTracking:"-0.04em"},
    spacing:{sectionPadding:82,containerPadding:4,cardPadding:26,gridGap:18,density:"default"},
    customSections:[]
  };

  function deepMerge(target, source) {
    if (!source || typeof source !== 'object') return target;
    for (const key of Object.keys(source)) {
      const sv = source[key], tv = target[key];
      if (Array.isArray(sv)) target[key] = sv;
      else if (sv && typeof sv === 'object' && tv && typeof tv === 'object' && !Array.isArray(tv)) deepMerge(tv, sv);
      else target[key] = sv;
    }
    return target;
  }

  async function loadContent() {
    const isPreview = new URLSearchParams(location.search).has('preview');
    if (isPreview) {
      try {
        const saved = localStorage.getItem('koral-content-v1');
        if (saved) return deepMerge(JSON.parse(JSON.stringify(CONTENT_SHAPE)), JSON.parse(saved));
      } catch(e) { throw new Error('Preview load failed: ' + e.message); }
    }
    try {
      const res = await fetch('content.json?_=' + Date.now(), { cache: 'no-store' });
      if (!res.ok) {
        if (res.status === 404) throw new Error('CONTENT_MISSING');
        throw new Error('Server returned ' + res.status);
      }
      return deepMerge(JSON.parse(JSON.stringify(CONTENT_SHAPE)), await res.json());
    } catch(e) {
      if (e.message === 'CONTENT_MISSING') throw new Error('CONTENT_MISSING');
      throw new Error('Could not load content.json: ' + e.message);
    }
  }

  (async function boot(){
    let data;
    try {
      data = await loadContent();
    } catch (err) {
      if (err.message === 'CONTENT_MISSING') {
        showError('No content.json found on the server.',
          '<p style="margin-top:12px">The site loads all content from <code>content.json</code>. It has not been published yet.</p>' +
          '<p style="margin-top:10px">To fix this:</p>' +
          '<ol style="margin:10px 0 0 20px;line-height:1.8">' +
            '<li>Open the admin console at <code>/admin.html</code></li>' +
            '<li>Click <strong>Publish to GitHub</strong> to commit content.json</li>' +
            '<li>Wait ~1 minute for GitHub Pages to rebuild</li>' +
            '<li>Refresh this page</li>' +
          '</ol>');
      } else {
        showError(err.message, '<p style="margin-top:12px">Check that content.json exists next to index.html and contains valid JSON.</p>');
      }
      return;
    }

    // Typography + spacing
    if (data.typography) {
      const t = data.typography, r = document.documentElement.style;
      if (t.baseSize) r.setProperty('--base-size', t.baseSize + 'px');
      if (t.headingScale) r.setProperty('--heading-scale', t.headingScale);
      if (t.headingWeight) r.setProperty('--heading-weight', t.headingWeight);
      if (t.headingTracking) r.setProperty('--heading-tracking', t.headingTracking);
    }
    if (data.spacing) {
      const s = data.spacing, r = document.documentElement.style;
      if (s.sectionPadding) r.setProperty('--section-pad', s.sectionPadding + 'px');
      if (s.containerPadding) r.setProperty('--container-pad', s.containerPadding + '%');
      if (s.cardPadding) r.setProperty('--card-pad', s.cardPadding + 'px');
      if (s.gridGap) r.setProperty('--grid-gap', s.gridGap + 'px');
    }

    // Text
    function setText(path, value) {
      if (value === undefined || value === null) return;
      document.querySelectorAll('[data-content="' + path + '"]').forEach(el => { el.textContent = value; });
    }
    function walk(obj, prefix) {
      if (!obj) return;
      for (const [key, val] of Object.entries(obj)) {
        const path = prefix ? prefix + '.' + key : key;
        if (typeof val === 'string' || typeof val === 'number') setText(path, val);
        else if (Array.isArray(val)) {}
        else if (typeof val === 'object' && val !== null) walk(val, path);
      }
    }
    walk(data, '');

    // Logo
    function applyLogo(el, logoUrl, brandName) {
      if (!el) return;
      if (logoUrl) {
        el.innerHTML = '<img src="' + logoUrl + '" alt="' + (brandName || 'Logo') + '">';
      } else if (brandName) {
        el.innerHTML = '<b>' + brandName.charAt(0) + '</b>' + brandName.slice(1);
      }
    }
    applyLogo(document.getElementById('siteLogo'), data.site?.logoUrl, data.site?.brandName);
    applyLogo(document.getElementById('footerLogo'), data.footer?.brand?.logoUrl || data.site?.logoUrl, data.footer?.brand?.name || data.site?.brandName);

    // Hero background
    const hero = document.getElementById('hero-section');
    if (hero && data.home?.hero?.bgImage) {
      hero.style.backgroundImage = 'url(' + data.home.hero.bgImage + ')';
    } else if (hero) {
      hero.style.backgroundImage = "url('https://images.unsplash.com/photo-1593941707882-a5bba14938c7?auto=format&fit=crop&w=2000&q=85')";
    }

    // Stats
    const statsGrid = document.getElementById('stats-grid');
    if (statsGrid && data.home?.stats) {
      statsGrid.innerHTML = data.home.stats.map(s =>
        '<div class="stat"><strong>' + s.value + '</strong><span>' + s.label + '</span></div>'
      ).join('');
    }

    // Partners
    const partnersSection = document.getElementById('partners-section');
    const partnersTrack = document.getElementById('partners-track');
    if (data.home?.partners?.items?.length) {
      let seq = data.home.partners.items.slice();
      while (seq.length < 6 && seq.length > 0) seq = seq.concat(data.home.partners.items);
      const loop = seq.concat(seq);
      partnersTrack.innerHTML = loop.map(p => {
        const inner = p.logoUrl
          ? '<img src="' + p.logoUrl + '" alt="' + (p.name || '') + '" loading="lazy">'
          : '<span class="partner-logo__name">' + (p.name || '') + '</span>';
        const open = p.url ? '<a href="' + p.url + '" target="_blank" rel="noopener" class="partner-logo">' : '<div class="partner-logo">';
        const close = p.url ? '</a>' : '</div>';
        return open + inner + close;
      }).join('');
      partnersSection.style.display = '';
    }

    // Features
    const featuresGrid = document.getElementById('features-grid');
    if (featuresGrid && data.home?.features?.items) {
      featuresGrid.innerHTML = data.home.features.items.map(f =>
        '<article class="feat-card">' +
          (f.imageUrl ? '<div class="feat-card__img"><img src="' + f.imageUrl + '" alt="" loading="lazy"></div>' : (f.icon ? '<div class="feat-card__icon">' + f.icon + '</div>' : '')) +
          '<h3>' + f.title + '</h3>' +
          '<p>' + f.text + '</p>' +
        '</article>'
      ).join('');
    }

    // Vehicles (home)
    const vehiclesGrid = document.getElementById('vehicles-grid');
    if (vehiclesGrid && data.home?.vehicles?.items) {
      vehiclesGrid.innerHTML = data.home.vehicles.items.map(v =>
        '<article class="vehicle">' +
          '<div class="vehicle__art">' + (v.imageUrl ? '<img src="' + v.imageUrl + '" alt="" loading="lazy">' : '<span class="vehicle__symbol">' + (v.symbol || '🛵') + '</span>') + '</div>' +
          '<div class="vehicle__body">' +
            '<h3>' + v.name + '</h3>' +
            '<p>' + v.desc + '</p>' +
            (v.tag ? '<span class="tag">' + v.tag + '</span>' : '') +
          '</div>' +
        '</article>'
      ).join('');
    }

    // Vehicles (page)
    const vehiclesPageGrid = document.getElementById('vehicles-page-grid');
    if (vehiclesPageGrid && data.vehicles?.hero?.items) {
      vehiclesPageGrid.innerHTML = data.vehicles.hero.items.map(v =>
        '<article class="vehicle">' +
          '<div class="vehicle__art">' + (v.imageUrl ? '<img src="' + v.imageUrl + '" alt="" loading="lazy">' : '<span class="vehicle__symbol">' + (v.symbol || '🛵') + '</span>') + '</div>' +
          '<div class="vehicle__body">' +
            '<h3>' + v.name + '</h3>' +
            '<p>' + v.desc + '</p>' +
            (v.tag ? '<span class="tag">' + v.tag + '</span>' : '') +
          '</div>' +
        '</article>'
      ).join('');
    }

    // Charging (home)
    const chargingGrid = document.getElementById('charging-grid');
    if (chargingGrid && data.home?.charging?.items) {
      chargingGrid.innerHTML = data.home.charging.items.map(c =>
        '<div class="charge-card">' +
          '<div class="charge-card__icon">' + (c.icon || '⚡') + '</div>' +
          '<h3>' + c.title + '</h3>' +
          '<p>' + c.text + '</p>' +
          (c.linkLabel ? '<a href="#" data-nav="business">' + c.linkLabel + '</a>' : '') +
        '</div>'
      ).join('');
    }

    // Charging (page)
    const chargingPageGrid = document.getElementById('charging-page-grid');
    if (chargingPageGrid && data.charging?.hero?.items) {
      chargingPageGrid.innerHTML = data.charging.hero.items.map(c =>
        '<div class="charge-card">' +
          '<div class="charge-card__icon">' + (c.icon || '⚡') + '</div>' +
          '<h3>' + c.title + '</h3>' +
          '<p>' + c.text + '</p>' +
          (c.linkLabel ? '<a href="#" data-nav="business">' + c.linkLabel + '</a>' : '') +
        '</div>'
      ).join('');
    }

    // Charging process
    const chargingProcessGrid = document.getElementById('charging-process-grid');
    if (chargingProcessGrid && data.charging?.process?.items) {
      chargingProcessGrid.innerHTML = data.charging.process.items.map(p =>
        '<div class="tech-card"><span class="eyebrow">' + (p.eyebrow || '') + '</span><h3>' + p.title + '</h3><p>' + p.text + '</p></div>'
      ).join('');
    }

    // App benefits (home)
    const appBenefits = document.getElementById('app-benefits');
    if (appBenefits && data.home?.app?.benefits) {
      appBenefits.innerHTML = data.home.app.benefits.map(b =>
        '<div class="benefit"><span class="benefit__check">✓</span><p><strong>' + b.title + '</strong>' + b.text + '</p></div>'
      ).join('');
    }

    // App page benefits
    const appPageBenefits = document.getElementById('app-page-benefits');
    if (appPageBenefits && data.app?.hero?.benefits) {
      appPageBenefits.innerHTML = data.app.hero.benefits.map(b =>
        '<div class="benefit"><span class="benefit__check">✓</span><p><strong>' + b.title + '</strong>' + b.text + '</p></div>'
      ).join('');
    }

    // Technology
    const techGrid = document.getElementById('tech-grid');
    if (techGrid && data.home?.technology?.items) {
      techGrid.innerHTML = data.home.technology.items.map(t =>
        '<div class="tech-card"><span class="eyebrow">' + (t.eyebrow || '') + '</span><h3>' + t.title + '</h3><p>' + t.text + '</p></div>'
      ).join('');
    }

    // Testimonials
    const testGrid = document.getElementById('testimonials-grid');
    if (testGrid && data.home?.testimonials?.items) {
      testGrid.innerHTML = data.home.testimonials.items.map(t =>
        '<blockquote class="quote"><p>"' + t.quote + '"</p>' +
        '<div class="quote__who"><div class="avatar">' + (t.avatarUrl ? '<img src="' + t.avatarUrl + '" alt="">' : t.initials) + '</div>' +
        '<div><span class="quote__name">' + t.name + '</span><span class="quote__role">' + t.role + '</span></div></div></blockquote>'
      ).join('');
    }

    // Business benefits
    const bizBenefits = document.getElementById('business-benefits');
    if (bizBenefits && data.business?.hero?.benefits) {
      bizBenefits.innerHTML = data.business.hero.benefits.map(b =>
        '<div class="benefit"><span class="benefit__check">✓</span><p><strong>' + b.title + '</strong>' + b.text + '</p></div>'
      ).join('');
    }

    // About values
    const aboutValues = document.getElementById('about-values');
    if (aboutValues && data.about?.hero?.values) {
      aboutValues.innerHTML = data.about.hero.values.map(v =>
        '<div class="tech-card"><span class="eyebrow">' + (v.eyebrow || '') + '</span><h3>' + v.title + '</h3><p>' + v.text + '</p></div>'
      ).join('');
    }

    // Footer
    const socials = document.getElementById('socials-container');
    if (socials && data.footer?.brand?.socials) {
      socials.innerHTML = data.footer.brand.socials.map(s => '<a href="' + s.url + '">' + s.label + '</a>').join('');
    }
    function renderFooterLinks(id, items) {
      const el = document.getElementById(id);
      if (el && items) el.innerHTML = items.map(i => '<li><a href="#" data-nav="' + (i.nav || 'home') + '">' + i.label + '</a></li>').join('');
    }
    renderFooterLinks('footer-explore-links', data.footer?.explore?.links);
    renderFooterLinks('footer-company-links', data.footer?.company?.links);
    renderFooterLinks('footer-contact-links', data.footer?.contact?.links);

    // Custom sections
    function renderCustomSections() {
      const list = data.customSections || [];
      document.querySelectorAll('[data-custom-page]').forEach(container => {
        const pageId = container.dataset.customPage;
        container.innerHTML = list.filter(s => s.page === pageId).map(renderCustomSection).join('');
      });
    }
    function renderCustomSection(sec) {
      const e = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
      switch (sec.type) {
        case 'text':
          return '<section class="section"><div class="container"><div style="max-width:760px;' + (sec.align === 'center' ? 'margin:0 auto;text-align:center;' : '') + '">' +
            (sec.eyebrow ? '<span class="eyebrow">' + e(sec.eyebrow) + '</span>' : '') +
            (sec.title ? '<h2>' + e(sec.title) + '</h2>' : '') +
            (sec.body ? '<p class="sub" style="margin-top:14px">' + e(sec.body) + '</p>' : '') +
          '</div></div></section>';
        case 'image': {
          const img = sec.imageUrl ? '<img src="' + e(sec.imageUrl) + '" alt="" style="width:100%;border-radius:20px;display:block">' : '';
          const content = sec.width === 'full' ? img : '<div class="container">' + img + '</div>';
          const caption = sec.caption ? '<p style="text-align:center;margin-top:14px;color:var(--txt-2);font-size:.84rem">' + e(sec.caption) + '</p>' : '';
          return '<section class="section"><div style="position:relative">' + content + caption + '</div></section>';
        }
        case 'video':
          return '<section class="section"><div class="container">' +
            '<video ' + (sec.posterUrl ? 'poster="' + e(sec.posterUrl) + '"' : '') + ' muted playsinline loop controls style="width:100%;border-radius:20px;display:block;background:#000">' +
              '<source src="' + e(sec.videoUrl) + '" type="video/mp4">' +
            '</video>' +
            (sec.caption ? '<p style="text-align:center;margin-top:14px;color:var(--txt-2);font-size:.84rem">' + e(sec.caption) + '</p>' : '') +
          '</div></section>';
        case 'split': {
          const media = sec.mediaType === 'video'
            ? '<div style="border-radius:20px;overflow:hidden"><video src="' + e(sec.mediaUrl) + '" muted playsinline loop controls style="width:100%;height:100%;object-fit:cover"></video></div>'
            : '<div style="border-radius:20px;overflow:hidden">' + (sec.mediaUrl ? '<img src="' + e(sec.mediaUrl) + '" alt="" style="width:100%;height:100%;object-fit:cover">' : '') + '</div>';
          const textBlock = '<div>' +
            (sec.eyebrow ? '<span class="eyebrow">' + e(sec.eyebrow) + '</span>' : '') +
            (sec.title ? '<h2>' + e(sec.title) + '</h2>' : '') +
            (sec.text ? '<p class="sub" style="margin-top:14px">' + e(sec.text) + '</p>' : '') +
            (sec.bullets && sec.bullets.length ? '<ul style="margin-top:22px">' + sec.bullets.map(b => '<li style="display:flex;gap:10px;padding:8px 0;color:var(--txt-2)"><span style="color:var(--green);font-weight:900">✓</span>' + e(b) + '</li>').join('') + '</ul>' : '') +
          '</div>';
          return '<section class="section"><div class="container app-grid">' + (sec.reverse ? media + textBlock : textBlock + media) + '</div></section>';
        }
        case 'marquee': {
          const items = (sec.items || []).concat(sec.items || []);
          return '<section class="section" style="padding:30px 0;border-top:1px solid var(--line-soft);border-bottom:1px solid var(--line-soft)"><div class="partners-marquee"><div class="partners-marquee__track">' +
            items.map(t => '<span style="font-family:var(--display);font-size:.9rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--txt-2);white-space:nowrap">' + e(t) + '</span>').join('') +
          '</div></div></section>';
        }
        case 'cards':
          return '<section class="section"><div class="container">' +
            ((sec.eyebrow || sec.title) ? '<div class="section-head"><div>' +
              (sec.eyebrow ? '<span class="eyebrow">' + e(sec.eyebrow) + '</span>' : '') +
              (sec.title ? '<h2>' + e(sec.title) + '</h2>' : '') +
            '</div></div>' : '') +
            '<div class="tech-grid">' +
              (sec.items || []).map(c =>
                '<div class="tech-card">' +
                  (c.imageUrl ? '<div style="border-radius:12px;overflow:hidden;margin-bottom:14px"><img src="' + e(c.imageUrl) + '" alt="" loading="lazy" style="width:100%;height:150px;object-fit:cover;display:block"></div>' : '') +
                  '<h3>' + e(c.title) + '</h3>' +
                  '<p>' + e(c.text || '') + '</p>' +
                '</div>'
              ).join('') +
            '</div></div></section>';
        case 'cta': {
          const bg = sec.bgImage ? ' style="background-image:url(' + e(sec.bgImage) + ');background-size:cover;background-position:center"' : '';
          return '<section class="cta-band"' + bg + '><div class="container cta-band__inner">' +
            (sec.title ? '<h2>' + e(sec.title) + '</h2>' : '') +
            (sec.text ? '<p>' + e(sec.text) + '</p>' : '') +
            '<div class="btn-group">' +
              (sec.primaryLabel ? '<button class="btn btn--lg" data-nav="' + e(sec.primaryLink || 'business') + '">' + e(sec.primaryLabel) + '</button>' : '') +
              (sec.secondaryLabel ? '<button class="btn btn--lg btn--outline" data-nav="' + e(sec.secondaryLink || 'vehicles') + '">' + e(sec.secondaryLabel) + '</button>' : '') +
            '</div></div></section>';
        }
        case 'hero': {
          const bg = sec.bgImage ? ' style="background-image:url(' + e(sec.bgImage) + ');background-size:cover;background-position:center"' : '';
          return '<section class="hero"' + bg + '><div class="container"><div class="hero__inner">' +
            (sec.title ? '<h1>' + e(sec.title) + '</h1>' : '') +
            (sec.subtitle ? '<p>' + e(sec.subtitle) + '</p>' : '') +
            (sec.primaryLabel ? '<div class="hero__actions"><button class="btn btn--lg" data-nav="' + e(sec.primaryLink || 'vehicles') + '">' + e(sec.primaryLabel) + '</button></div>' : '') +
          '</div></div></section>';
        }
        default: return '';
      }
    }
    renderCustomSections();

    // Router
    const pages = document.querySelectorAll('.page');
    const drawer = document.getElementById('navDrawer');
    const menuBtn = document.getElementById('menuBtn');

    function navigate(id) {
      pages.forEach(p => p.classList.toggle('active', p.id === 'page-' + id));
      document.querySelectorAll('.nav__link').forEach(b => b.classList.toggle('is-active', b.dataset.nav === id));
      history.replaceState(null, '', '#' + id);
      drawer.classList.remove('is-open');
      window.scrollTo({ top: 0, behavior: 'auto' });
    }
    document.addEventListener('click', e => {
      const btn = e.target.closest('[data-nav]');
      if (btn) { e.preventDefault(); navigate(btn.dataset.nav); }
    });
    menuBtn.addEventListener('click', () => drawer.classList.toggle('is-open'));

    const hash = (location.hash || '#home').slice(1);
    const valid = ['home','vehicles','charging','business','about','app'];
    navigate(valid.includes(hash) ? hash : 'home');

    document.body.classList.add('content-loaded');
  })();
})();
</script>
</body>
</html>
