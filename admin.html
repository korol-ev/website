<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>KOROL — Admin Console</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@500;600;700;800;900&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0a0a;--bg-1:#0f0f0f;--bg-2:#141414;--bg-3:#1a1a1a;--line:rgba(255,255,255,.07);--line-2:rgba(255,255,255,.13);--lime:#c8f542;--lime-2:#d9ff5e;--lime-dim:rgba(200,245,66,.1);--lime-line:rgba(200,245,66,.28);--cyan:#5eead4;--txt:#f2f2f2;--txt-2:#8f8f8f;--txt-3:#5a5a5a;--red:#ff5f57;--green:#28c840;--amber:#febc2e;--display:'Outfit',sans-serif;--body:'Inter',sans-serif;--mono:'JetBrains Mono',monospace;--ease:cubic-bezier(.22,.61,.36,1)}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{font-family:var(--body);background:var(--bg);color:var(--txt);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
a{color:inherit;text-decoration:none}
ul{list-style:none}
input,textarea,select{outline:none}
.app{display:grid;grid-template-columns:280px 1fr;height:100vh;overflow:hidden}
.sidebar{background:var(--bg-1);border-right:1px solid var(--line);display:flex;flex-direction:column;overflow:hidden}
.sidebar__head{padding:22px 22px 18px;border-bottom:1px solid var(--line)}
.sidebar__logo{font-family:var(--display);font-size:1.15rem;font-weight:800;letter-spacing:.18em;color:var(--txt)}
.sidebar__logo b{background:linear-gradient(120deg,var(--lime),var(--cyan));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;font-weight:800}
.sidebar__sub{font-size:.68rem;color:var(--txt-3);margin-top:4px;letter-spacing:.14em;text-transform:uppercase;font-weight:600}
.sidebar__nav{flex:1;overflow-y:auto;padding:16px 12px}
.sidebar__group{margin-bottom:22px}
.sidebar__group-label{font-size:.62rem;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:#3a3a3a;padding:0 10px;margin-bottom:8px}
.sidebar__item{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:9px;font-size:.85rem;color:var(--txt-2);cursor:pointer;transition:.15s var(--ease);width:100%;text-align:left;font-weight:500}
.sidebar__item:hover{background:var(--bg-2);color:var(--txt)}
.sidebar__item.is-active{background:var(--lime-dim);color:var(--lime);font-weight:700}
.sidebar__item svg{width:15px;height:15px;flex-shrink:0;stroke-width:1.8}
.sidebar__foot{padding:14px 18px;border-top:1px solid var(--line);font-size:.72rem;color:var(--txt-2);display:flex;align-items:center;gap:8px}
.status-dot{width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 8px currentColor}
.status-dot.warn{background:var(--amber)}
.status-dot.err{background:var(--red)}
.main{display:flex;flex-direction:column;overflow:hidden;background:var(--bg)}
.topbar{height:66px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 26px;background:var(--bg-1);flex-shrink:0;gap:20px}
.topbar__title{font-family:var(--display);font-size:1.02rem;font-weight:700;letter-spacing:-.01em}
.topbar__title small{color:var(--txt-3);font-weight:400;font-size:.78rem;font-family:var(--body);margin-left:10px}
.topbar__actions{display:flex;gap:8px;align-items:center}
.content{flex:1;overflow-y:auto;padding:32px 40px 80px;max-width:1100px;width:100%}
.btn{display:inline-flex;align-items:center;gap:7px;font-size:.8rem;font-weight:700;padding:9px 16px;border-radius:999px;transition:.2s var(--ease);white-space:nowrap;border:1px solid transparent}
.btn svg{width:14px;height:14px;stroke-width:2}
.btn--primary{background:var(--lime);color:#0a0a0a}
.btn--primary:hover{background:var(--lime-2);box-shadow:0 0 20px rgba(200,245,66,.28);transform:translateY(-1px)}
.btn--ghost{border-color:var(--line-2);color:var(--txt);background:transparent}
.btn--ghost:hover{border-color:var(--lime-line);color:var(--lime);background:var(--lime-dim)}
.btn--danger{border-color:rgba(255,95,87,.3);color:var(--red)}
.btn--danger:hover{background:rgba(255,95,87,.1)}
.btn--sm{padding:6px 12px;font-size:.73rem}
.btn:disabled{opacity:.5;cursor:not-allowed}
.section-card{background:var(--bg-1);border:1px solid var(--line);border-radius:14px;padding:26px 28px;margin-bottom:18px}
.section-card__head{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;margin-bottom:22px;padding-bottom:16px;border-bottom:1px solid var(--line)}
.section-card__title{font-family:var(--display);font-size:.95rem;font-weight:700;letter-spacing:-.01em}
.section-card__desc{font-size:.78rem;color:var(--txt-2);margin-top:3px;line-height:1.55}
.section-card__desc code{font-family:var(--mono);font-size:.72rem;background:var(--bg-3);padding:2px 6px;border-radius:4px;color:var(--lime)}
.field{margin-bottom:18px}
.field:last-child{margin-bottom:0}
.field__label{display:block;font-size:.7rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--txt-2);margin-bottom:7px}
.field__hint{font-size:.72rem;color:var(--txt-3);margin-top:5px;line-height:1.5}
.field__input,.field__textarea,.field__select{width:100%;padding:10px 13px;border-radius:9px;background:var(--bg-2);border:1px solid var(--line-2);color:var(--txt);font-size:.85rem;transition:.15s var(--ease);font-family:var(--body)}
.field__textarea{resize:vertical;min-height:80px;line-height:1.6}
.field__input:focus,.field__textarea:focus,.field__select:focus{border-color:var(--lime-line);box-shadow:0 0 0 3px var(--lime-dim);background:var(--bg-3)}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.media-preview{margin-top:10px;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:var(--bg-2);position:relative;min-height:60px;display:grid;place-items:center}
.media-preview img,.media-preview video{width:100%;max-height:240px;object-fit:cover;display:block}
.media-preview__empty{padding:20px;text-align:center;color:var(--txt-3);font-size:.75rem}
.media-preview__badge{position:absolute;top:8px;left:8px;background:rgba(0,0,0,.75);color:var(--lime);font-size:.65rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:3px 8px;border-radius:5px}
.list-item{border:1px solid var(--line);border-radius:10px;padding:18px 20px;margin-bottom:12px;background:var(--bg-2);transition:.2s var(--ease)}
.list-item:hover{border-color:var(--line-2);background:var(--bg-3)}
.list-item__head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
.list-item__title{font-size:.76rem;font-weight:700;color:var(--lime);letter-spacing:.1em;text-transform:uppercase}
.list-item__controls{display:flex;gap:4px}
.list-item__btn{width:28px;height:28px;border-radius:7px;display:grid;place-items:center;color:var(--txt-2);transition:.15s var(--ease);border:1px solid transparent}
.list-item__btn:hover{background:var(--bg-3);color:var(--txt);border-color:var(--line-2)}
.list-item__btn--danger:hover{color:var(--red);background:rgba(255,95,87,.1);border-color:rgba(255,95,87,.3)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.75);backdrop-filter:blur(8px);z-index:250;display:none;place-items:center;padding:24px}
.modal.is-open{display:grid}
.modal__dialog{background:var(--bg-1);border:1px solid var(--line-2);border-radius:18px;padding:30px;max-width:560px;width:100%;max-height:90vh;overflow-y:auto}
.modal__title{font-family:var(--display);font-size:1.15rem;font-weight:800;margin-bottom:10px}
.modal__text{font-size:.85rem;color:var(--txt-2);line-height:1.65;margin-bottom:22px}
.modal__text code{font-family:var(--mono);font-size:.78rem;background:var(--bg-3);padding:2px 6px;border-radius:4px;color:var(--lime)}
.modal__actions{display:flex;gap:10px;justify-content:flex-end;margin-top:22px}
.toast-stack{position:fixed;bottom:24px;right:24px;z-index:300;display:flex;flex-direction:column;gap:10px;pointer-events:none}
.toast{background:var(--bg-3);color:var(--txt);border-radius:10px;padding:14px 20px;font-size:.83rem;box-shadow:0 10px 40px rgba(0,0,0,.6);display:flex;align-items:center;gap:10px;pointer-events:auto;min-width:280px;max-width:420px;animation:toastIn .3s var(--ease);border-left:3px solid var(--lime);border-top:1px solid var(--line);border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
.toast--success{border-left-color:var(--green)}
.toast--error{border-left-color:var(--red)}
.toast--info{border-left-color:var(--cyan)}
.toast__icon{width:18px;height:18px;flex-shrink:0}
.toast--success .toast__icon{color:var(--green)}
.toast--error .toast__icon{color:var(--red)}
.toast--info .toast__icon{color:var(--cyan)}
@keyframes toastIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes spin{to{transform:rotate(360deg)}}
.boot{position:fixed;inset:0;display:grid;place-items:center;background:var(--bg);z-index:9999;text-align:center;padding:40px}
.boot__logo{font-family:var(--display);font-size:1.5rem;font-weight:800;letter-spacing:.22em;margin-bottom:24px;color:var(--txt)}
.boot__logo b{background:linear-gradient(120deg,var(--lime),var(--cyan));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.boot__spinner{width:34px;height:34px;border:3px solid var(--line-2);border-top-color:var(--lime);border-radius:50%;margin:0 auto 20px;animation:spin 1s linear infinite}
.boot__msg{font-size:.9rem;color:var(--txt-2)}
.boot__error{background:var(--bg-2);border:1px solid rgba(255,95,87,.3);border-radius:12px;padding:22px;margin-top:20px;text-align:left}
.boot__error pre{font-family:var(--mono);font-size:.78rem;color:var(--red);white-space:pre-wrap;word-break:break-word;line-height:1.6}
.boot--hidden{display:none}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--bg-3);border-radius:5px;border:2px solid var(--bg)}
::-webkit-scrollbar-thumb:hover{background:var(--line-2)}
@media (max-width:900px){
  .app{grid-template-columns:1fr}
  .sidebar{position:fixed;inset:0 25% 0 0;z-index:100;transform:translateX(-100%);transition:.3s var(--ease)}
  .sidebar.is-open{transform:none}
  .content{padding:24px 20px 80px}
  .field-row{grid-template-columns:1fr}
  .topbar__title small{display:none}
}
</style>
</head>
<body>

<div class="boot" id="boot">
  <div>
    <div class="boot__logo"><b>K</b>OROL</div>
    <div class="boot__spinner"></div>
    <div class="boot__msg" id="bootMsg">Loading admin console...</div>
    <div id="bootError" style="display:none"></div>
  </div>
</div>

<div class="app" id="app" style="display:none">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar__head">
      <div class="sidebar__logo"><b>K</b>OROL</div>
      <div class="sidebar__sub">Admin Console</div>
    </div>
    <nav class="sidebar__nav" id="sidebarNav"></nav>
    <div class="sidebar__foot">
      <span class="status-dot" id="saveStatus"></span>
      <span id="saveStatusText">Ready</span>
    </div>
  </aside>
  <main class="main">
    <header class="topbar">
      <div class="topbar__title" id="pageTitle">Home Page <small>Edit content without touching code</small></div>
      <div class="topbar__actions">
        <button class="btn btn--ghost btn--sm" id="btnPreview">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
          Preview
        </button>
        <button class="btn btn--ghost btn--sm" id="btnReset">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 3v6h6"/></svg>
          Reset
        </button>
        <button class="btn btn--ghost btn--sm" id="btnDownload">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
          Export JSON
        </button>
        <button class="btn btn--primary btn--sm" id="btnPublish">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5"/><polyline points="5 12 12 5 19 12"/></svg>
          Publish to GitHub
        </button>
      </div>
    </header>
    <div class="content" id="contentArea"></div>
  </main>
</div>

<div class="modal" id="confirmModal">
  <div class="modal__dialog">
    <h2 class="modal__title" id="confirmTitle">Are you sure?</h2>
    <p class="modal__text" id="confirmText"></p>
    <div class="modal__actions">
      <button class="btn btn--ghost" id="confirmCancel">Cancel</button>
      <button class="btn btn--danger" id="confirmOk">Confirm</button>
    </div>
  </div>
</div>

<div class="modal" id="publishModal">
  <div class="modal__dialog">
    <h2 class="modal__title">Publish to GitHub</h2>
    <p class="modal__text">Commits <code>content.json</code> directly to your repository. GitHub Pages rebuilds automatically.</p>
    <div class="field">
      <label class="field__label">Repository (owner/name)</label>
      <input class="field__input" id="ghRepo" placeholder="korol-ev/website">
    </div>
    <div class="field-row">
      <div class="field"><label class="field__label">Branch</label><input class="field__input" id="ghBranch" value="main"></div>
      <div class="field"><label class="field__label">File Path</label><input class="field__input" id="ghPath" value="content.json"></div>
    </div>
    <div class="field">
      <label class="field__label">Personal Access Token</label>
      <input class="field__input" id="ghToken" type="password" placeholder="ghp_...">
      <div class="field__hint">Generate at github.com/settings/tokens with <strong>repo</strong> scope.</div>
    </div>
    <div class="field">
      <label class="field__label">Commit Message</label>
      <input class="field__input" id="ghMessage" value="Update site content">
    </div>
    <div class="modal__actions">
      <button class="btn btn--ghost" id="publishCancel">Cancel</button>
      <button class="btn btn--primary" id="publishConfirm">Publish Now</button>
    </div>
  </div>
</div>

<div class="toast-stack" id="toastStack"></div>

  function loadContent() {
    try {
      const saved = localStorage.getItem(LS_KEY);
      if (saved) {
        content = deepMerge(JSON.parse(JSON.stringify(DEFAULT_CONTENT)), JSON.parse(saved));
        return;
      }
    } catch (e) {
      console.warn('localStorage load failed:', e);
      localStorage.removeItem(LS_KEY);
    }
  }

  function deepMerge(target, source) {
    if (!source || typeof source !== 'object') return target;
    for (const key of Object.keys(source)) {
      const sv = source[key], tv = target[key];
      if (Array.isArray(sv)) target[key] = sv;
      else if (sv && typeof sv === 'object' && tv && typeof tv === 'object' && !Array.isArray(tv)) deepMerge(tv, sv);
      else target[key] = sv;
    }
    return target;
  }

      </div>
    `).join('');
    nav.querySelectorAll('[data-section]').forEach(btn => {

  function renderCustomEditor(sec, i) {
    const path = 'customSections.' + i;

      { value:'charging', label:'Charging' }, { value:'business', label:'Business' },

      case 'text': body = field('Eyebrow', 'text', path+'.eyebrow', sec.eyebrow) + field('Title', 'text', path+'.title', sec.title) + field('Body', 'textarea', path+'.body', sec.body) + field('Alignment', 'select', path+'.align', sec.align || 'center', null, [{ value:'center', label:'Center' }, { value:'left', label:'Left' }]); break;
      case 'image': body = mediaFieldHTML({ label:'Image', kind:'image', path: path+'.imageUrl', value: sec.imageUrl }) + field('Caption', 'text', path+'.caption', sec.caption) + field('Width', 'select', path+'.width', sec.width || 'boxed', null, [{ value:'boxed', label:'Boxed' }, { value:'full', label:'Full width' }]); break;
      case 'video': body = mediaFieldHTML({ label:'Video', kind:'video', path: path+'.videoUrl', value: sec.videoUrl }) + mediaFieldHTML({ label:'Poster', kind:'image', path: path+'.posterUrl', value: sec.posterUrl }) + field('Caption', 'text', path+'.caption', sec.caption); break;
      case 'split': body = field('Eyebrow', 'text', path+'.eyebrow', sec.eyebrow) + field('Title', 'text', path+'.title', sec.title) + field('Text', 'textarea', path+'.text', sec.text) + listCard('Bullets', '', path+'.bullets', sec.bullets || [], [{ key:'', label:'Text', type:'text' }], 'simple') + field('Media Type', 'select', path+'.mediaType', sec.mediaType || 'image', null, [{ value:'image', label:'Image' }, { value:'video', label:'Video' }]) + mediaFieldHTML({ label:'Media', kind: sec.mediaType || 'image', path: path+'.mediaUrl', value: sec.mediaUrl }) + field('Media Position', 'select', path+'.reverse', String(sec.reverse || false), null, [{ value:'false', label:'Media on right' }, { value:'true', label:'Media on left' }]); break;
      case 'marquee': body = listCard('Items', '', path+'.items', sec.items || [], [{ key:'', label:'Text', type:'text' }], 'simple'); break;
      case 'cards': body = field('Eyebrow', 'text', path+'.eyebrow', sec.eyebrow) + field('Title', 'text', path+'.title', sec.title) + listCard('Cards', '', path+'.items', sec.items || [], [{ key:'title', label:'Title', type:'text' }, { key:'text', label:'Description', type:'textarea' }, { key:'imageUrl', label:'Image', type:'media', mediaType:'image' }]); break;
      case 'cta': body = field('Title', 'text', path+'.title', sec.title) + field('Description', 'textarea', path+'.text', sec.text) + field('Primary Button Label', 'text', path+'.primaryLabel', sec.primaryLabel) + field('Primary Button Link', 'select', path+'.primaryLink', sec.primaryLink || 'business', null, pageOptions) + field('Secondary Button Label', 'text', path+'.secondaryLabel', sec.secondaryLabel) + field('Secondary Button Link', 'select', path+'.secondaryLink', sec.secondaryLink || 'vehicles', null, pageOptions) + mediaFieldHTML({ label:'Background Image', kind:'image', path: path+'.bgImage', value: sec.bgImage }); break;
      case 'hero': body = field('Title', 'text', path+'.title', sec.title) + field('Subtitle', 'textarea', path+'.subtitle', sec.subtitle) + mediaFieldHTML({ label:'Background Image', kind:'image', path: path+'.bgImage', value: sec.bgImage }) + field('Primary Button Label', 'text', path+'.primaryLabel', sec.primaryLabel) + field('Primary Button Link', 'select', path+'.primaryLink', sec.primaryLink || 'vehicles', null, pageOptions); break;

    return `

            <button class="list-item__btn" data-move-custom="down" data-index="${i}" title="Move down"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polyline points="6 9 12 15 18 9"/></svg></button>

  function addCustomSection(type) {
    if (!content.customSections) content.customSections = [];
    const base = { id: 'cs_' + Date.now(), page: 'home', type: type };
    if (type === 'text') Object.assign(base, { eyebrow:'', title:'New Section', body:'', align:'center' });
    if (type === 'image') Object.assign(base, { imageUrl:'', caption:'', width:'boxed', bgImage:'' });
    if (type === 'video') Object.assign(base, { videoUrl:'', posterUrl:'', caption:'' });
    if (type === 'split') Object.assign(base, { eyebrow:'', title:'New Section', text:'', bullets:[], mediaType:'image', mediaUrl:'', reverse:false });
    if (type === 'marquee') Object.assign(base, { items:['Electric','Charging','Connected'] });
    if (type === 'cards') Object.assign(base, { eyebrow:'', title:'New Section', items:[{ title:'Card 1', text:'', imageUrl:'' }] });
    if (type === 'cta') Object.assign(base, { title:'Ready to get started?', text:'', primaryLabel:'Get in Touch', primaryLink:'business', secondaryLabel:'', secondaryLink:'vehicles', bgImage:'' });
    if (type === 'hero') Object.assign(base, { title:'New Hero', subtitle:'', bgImage:'', primaryLabel:'Learn More', primaryLink:'vehicles' });
    content.customSections.push(base);
    scheduleSave();
    renderSection('builder');
    toast('Section added — scroll down to edit', 'success');
  }

  function removeCustomSection(idx) { content.customSections.splice(idx, 1); scheduleSave(); renderSection('builder'); toast('Section removed', 'success'); }
  function moveCustomSection(idx, dir) {
    const arr = content.customSections || [];
    const ni = idx + dir;
    if (ni < 0 || ni >= arr.length) return;
    const [item] = arr.splice(idx, 1);
    arr.splice(ni, 0, item);
    scheduleSave();
    renderSection('builder');
  }

  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }

  function card(title, desc, fields) {
    return `<div class="section-card"><div class="section-card__head"><div><div class="section-card__title">${title}</div>${desc ? `<div class="section-card__desc">${desc}</div>` : ''}</div></div>${fields.filter(Boolean).join('')}</div>`;
  }

  function field(label, type, path, value, mediaType, options) {
    const v = esc(value);
    if (type === 'textarea') return `<div class="field"><label class="field__label">${label}</label><textarea class="field__textarea" data-path="${path}">${v}</textarea></div>`;
    if (type === 'select' && options) return `<div class="field"><label class="field__label">${label}</label><select class="field__select" data-path="${path}">${options.map(o => `<option value="${o.value}" ${String(value) === String(o.value) ? 'selected' : ''}>${o.label}</option>`).join('')}</select></div>`;
    if (type === 'media') return mediaFieldHTML({ label, kind: mediaType || 'image', path, value });
    return `<div class="field"><label class="field__label">${label}</label><input class="field__input" type="${type}" data-path="${path}" value="${v}"></div>`;
  }

  function numberField(label, path, value, step, min, max, hint) {
    return `<div class="field"><label class="field__label">${label}</label><input class="field__input" type="number" step="${step||1}" min="${min||0}" max="${max||100}" data-path="${path}" value="${value}">${hint ? '<div class="field__hint">' + hint + '</div>' : ''}</div>`;
  }

  function mediaFieldHTML(opts) {
    const isList = opts.listPath !== undefined && opts.listPath !== '' && opts.listIndex !== null && opts.listIndex !== undefined;
    const attrs = isList ? `data-list-path="${opts.listPath}" data-list-index="${opts.listIndex}" data-list-key="${opts.listKey}"` : `data-path="${opts.path}"`;
    const uploadAttrs = isList
      ? `data-upload-kind="${opts.kind}" data-upload-list-path="${opts.listPath}" data-upload-list-index="${opts.listIndex}" data-upload-list-key="${opts.listKey}"`
      : `data-upload-kind="${opts.kind}" data-upload-path="${opts.path}"`;
    const preview = opts.value
      ? (opts.kind === 'video'
          ? `<video src="${esc(opts.value)}" muted playsinline preload="metadata"></video><span class="media-preview__badge">Video</span>`
          : `<img src="${esc(opts.value)}" alt="" loading="lazy"><span class="media-preview__badge">Image</span>`)
      : `<div class="media-preview__empty">No ${opts.kind === 'video' ? 'video' : 'image'} yet — paste URL or click Upload</div>`;
    return `<div class="field"><label class="field__label">${opts.label}</label><div style="display:flex;gap:8px;align-items:stretch"><input class="field__input" style="flex:1" ${attrs} value="${esc(opts.value || '')}" placeholder="https://... or Upload →"><button type="button" class="btn btn--ghost upload-btn" ${uploadAttrs} style="white-space:nowrap"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg> Upload</button></div><div class="media-preview">${preview}</div></div>`;
  }

  function listCard(title, desc, path, items, itemFields, mode) {
    const isSimple = mode === 'simple';
    const listItems = (items || []).map((item, i) => {
      const valueGetter = (key) => {
        if (isSimple || key === '') return typeof item === 'object' ? (item.value != null ? item.value : '') : item;
        return item[key];
      };
      return `<div class="list-item"><div class="list-item__head"><div class="list-item__title">Item ${i+1}</div><div class="list-item__controls"><button class="list-item__btn" data-move="up" data-list="${path}" data-index="${i}" title="Up"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polyline points="18 15 12 9 6 15"/></svg></button><button class="list-item__btn" data-move="down" data-list="${path}" data-index="${i}" title="Down"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polyline points="6 9 12 15 18 9"/></svg></button><button class="list-item__btn list-item__btn--danger" data-remove-list="${path}" data-index="${i}" title="Delete"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg></button></div></div>${itemFields.map(f => {
        const key = f.key;
        const val = valueGetter(key);
        if (f.type === 'textarea') return `<div class="field"><label class="field__label">${f.label}</label><textarea class="field__textarea" data-list-path="${path}" data-list-index="${i}" data-list-key="${key}">${esc(val)}</textarea></div>`;
        if (f.type === 'media') return mediaFieldHTML({ label: f.label, kind: f.mediaType || 'image', listPath: path, listIndex: i, listKey: key, value: val });
        return `<div class="field"><label class="field__label">${f.label}</label><input class="field__input" data-list-path="${path}" data-list-index="${i}" data-list-key="${key}" value="${esc(val)}"></div>`;
      }).join('')}</div>`;
    }).join('');
    return `<div class="section-card"><div class="section-card__head"><div><div class="section-card__title">${title}</div>${desc ? `<div class="section-card__desc">${desc}</div>` : ''}</div><div><button class="btn btn--ghost btn--sm" data-add="${path}" data-add-simple="${isSimple ? '1' : '0'}">+ Add</button></div></div>${listItems || '<div style="padding:20px 0;color:var(--txt-3);font-size:.85rem;text-align:center">No items yet. Click "+ Add" to create one.</div>'}</div>`;
  }

  function bindSectionEvents() {
    const area = document.getElementById('contentArea');
    area.querySelectorAll('[data-path]').forEach(el => { el.addEventListener('input', onFieldInput); el.addEventListener('change', onFieldInput); });
    area.querySelectorAll('[data-list-path]').forEach(el => { el.addEventListener('input', onListFieldInput); el.addEventListener('change', onListFieldInput); });
    area.querySelectorAll('[data-add]').forEach(btn => btn.addEventListener('click', () => addListItem(btn.dataset.add, btn.dataset.addSimple === '1')));
    area.querySelectorAll('[data-remove-list]').forEach(btn => btn.addEventListener('click', () => confirmAction('Delete this item?', 'This will remove it from the content.', () => removeListItem(btn.dataset.removeList, parseInt(btn.dataset.index, 10)))));
    area.querySelectorAll('[data-move]').forEach(btn => btn.addEventListener('click', () => moveListItem(btn.dataset.list, parseInt(btn.dataset.index, 10), btn.dataset.move === 'up' ? -1 : 1)));
    area.querySelectorAll('.upload-btn').forEach(btn => bindUploadButton(btn));
    area.querySelectorAll('[data-add-custom]').forEach(btn => btn.addEventListener('click', () => addCustomSection(btn.dataset.addCustom)));
    area.querySelectorAll('[data-remove-custom]').forEach(btn => btn.addEventListener('click', () => confirmAction('Delete this section?', 'Cannot be undone.', () => removeCustomSection(parseInt(btn.dataset.removeCustom, 10)))));
    area.querySelectorAll('[data-move-custom]').forEach(btn => btn.addEventListener('click', () => moveCustomSection(parseInt(btn.dataset.index, 10), btn.dataset.moveCustom === 'up' ? -1 : 1)));
    area.querySelectorAll('[data-typo-preset]').forEach(btn => btn.addEventListener('click', () => applyTypoPreset(btn.dataset.typoPreset)));
    area.querySelectorAll('[data-spacing-preset]').forEach(btn => btn.addEventListener('click', () => applySpacingPreset(btn.dataset.spacingPreset)));
  }

  function onFieldInput(e) {
    const path = e.target.dataset.path;
    if (!path) return;
    let value = e.target.value;
    if (path.endsWith('.reverse')) value = value === 'true';
    if (path.startsWith('typography.') && path !== 'typography.headingTracking') { const n = parseFloat(value); if (!isNaN(n)) value = n; }
    if (path.startsWith('spacing.')) { const n = parseFloat(value); if (!isNaN(n)) value = n; }
    setByPath(content, path, value);
    scheduleSave();
  }

  function onListFieldInput(e) {
    const path = e.target.dataset.listPath;
    if (!path) return;
    const idx = parseInt(e.target.dataset.listIndex, 10);
    const key = e.target.dataset.listKey;
    const arr = getByPath(content, path);
    if (!arr || arr[idx] === undefined) return;
    const value = e.target.value;
    if (typeof arr[idx] === 'object' && arr[idx] !== null && !Array.isArray(arr[idx])) arr[idx][key] = value;
    else arr[idx] = value;
    scheduleSave();
  }

  function setByPath(obj, path, value) {
    const keys = path.split('.');
    let cur = obj;
    for (let i = 0; i < keys.length - 1; i++) { if (!(keys[i] in cur)) cur[keys[i]] = {}; cur = cur[keys[i]]; }
    cur[keys[keys.length - 1]] = value;
  }
  function getByPath(obj, path) { return path.split('.').reduce((o, k) => (o ? o[k] : undefined), obj); }

  function addListItem(path, isSimple) {
    const arr = getByPath(content, path);
    if (!Array.isArray(arr)) return;
    if (isSimple) arr.push('');
    else {
      let newItem = {};
      if (arr.length > 0 && typeof arr[0] === 'object' && arr[0] !== null) {
        for (const k of Object.keys(arr[0])) {
          const v = arr[0][k];
          newItem[k] = typeof v === 'string' ? '' : (typeof v === 'number' ? 0 : (Array.isArray(v) ? [] : {}));
        }
      }
      arr.push(newItem);
    }
    scheduleSave();
    renderSection(currentSection);
    toast('Item added', 'success');
  }

  function removeListItem(path, idx) { const arr = getByPath(content, path); if (!Array.isArray(arr)) return; arr.splice(idx, 1); scheduleSave(); renderSection(currentSection); toast('Item removed', 'success'); }

  function moveListItem(path, idx, dir) {
    const arr = getByPath(content, path);
    if (!Array.isArray(arr)) return;
    const ni = idx + dir;
    if (ni < 0 || ni >= arr.length) return;
    const [item] = arr.splice(idx, 1);
    arr.splice(ni, 0, item);
    scheduleSave();
    renderSection(currentSection);
  }

  function applyTypoPreset(name) {
    const presets = {
      compact:     { baseSize: 14, headingScale: 0.92, headingWeight: 800, headingTracking: '-0.05em' },
      default:     { baseSize: 16, headingScale: 1,    headingWeight: 800, headingTracking: '-0.04em' },
      comfortable: { baseSize: 17, headingScale: 1.05, headingWeight: 800, headingTracking: '-0.03em' },
      large:       { baseSize: 18, headingScale: 1.15, headingWeight: 900, headingTracking: '-0.05em' }
    };
    const p = presets[name];
    if (!p) return;
    content.typography = Object.assign({}, content.typography || {}, p);
    scheduleSave();
    renderSection('typography');
    toast(name.charAt(0).toUpperCase() + name.slice(1) + ' applied', 'success');
  }

  function applySpacingPreset(name) {
    const presets = {
      tight:    { sectionPadding: 50,  containerPadding: 3,  cardPadding: 20, gridGap: 14 },
      compact:  { sectionPadding: 66,  containerPadding: 4,  cardPadding: 22, gridGap: 16 },
      default:  { sectionPadding: 82,  containerPadding: 4,  cardPadding: 26, gridGap: 18 },
      relaxed:  { sectionPadding: 110, containerPadding: 5,  cardPadding: 32, gridGap: 24 },
      spacious: { sectionPadding: 140, containerPadding: 6,  cardPadding: 38, gridGap: 30 }
    };
    const p = presets[name];
    if (!p) return;
    content.spacing = Object.assign({}, content.spacing || {}, p, { density: name });
    scheduleSave();
    renderSection('spacing');
    toast(name.charAt(0).toUpperCase() + name.slice(1) + ' applied', 'success');
  }

  async function uploadFileToGitHub(file, targetPath) {
    const repo = document.getElementById('ghRepo').value.trim();
    const branch = document.getElementById('ghBranch').value.trim() || 'main';
    const token = document.getElementById('ghToken').value.trim();
    if (!repo || !token) { toast('Open "Publish to GitHub" first', 'error'); return null; }
    if (file.size > 100 * 1024 * 1024) { toast('File too large (max 100 MB)', 'error'); return null; }
    const base64 = await new Promise((resolve, reject) => {
      const r = new FileReader();
      r.onload = () => resolve(r.result.split(',')[1]);
      r.onerror = () => reject(new Error('Could not read file'));
      r.readAsDataURL(file);
    });
    let sha = null;
    try {
      const g = await fetch(`https://api.github.com/repos/${repo}/contents/${targetPath}?ref=${branch}`, { headers: { 'Authorization': `Bearer ${token}`, 'Accept': 'application/vnd.github+json' } });
      if (g.ok) sha = (await g.json()).sha;
    } catch(e) {}
    const putRes = await fetch(`https://api.github.com/repos/${repo}/contents/${targetPath}`, {
      method: 'PUT',
      headers: { 'Authorization': `Bearer ${token}`, 'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: 'Upload ' + targetPath, content: base64, branch, ...(sha ? { sha } : {}) })
    });
    if (!putRes.ok) {
      const err = await putRes.json().catch(() => ({}));
      throw new Error(err.message || 'Upload failed (' + putRes.status + ')');
    }
    return targetPath;
  }

  function bindUploadButton(btn) {
    btn.addEventListener('click', () => {
      const kind = btn.dataset.uploadKind;
      const path = btn.dataset.uploadPath;
      const listPath = btn.dataset.uploadListPath;
      const listIndex = btn.dataset.uploadListIndex ? parseInt(btn.dataset.uploadListIndex, 10) : null;
      const listKey = btn.dataset.uploadListKey;
      const input = document.createElement('input');
      input.type = 'file';
      input.accept = kind === 'video' ? 'video/mp4,video/webm,video/quicktime' : 'image/*';
      input.addEventListener('change', async () => {
        const file = input.files[0];
        if (!file) return;
        const safeName = file.name.toLowerCase().replace(/[^a-z0-9.\-_]/g, '-').replace(/-+/g, '-');
        const folder = kind === 'video' ? 'assets/videos' : 'assets/images';
        const targetPath = folder + '/' + Date.now() + '-' + safeName;
        const originalHTML = btn.innerHTML;
        btn.disabled = true;
        btn.innerHTML = '<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" style="animation:spin 1s linear infinite"><path d="M21 12a9 9 0 1 1-3-6.7"/></svg> Uploading...';
        try {
          const result = await uploadFileToGitHub(file, targetPath);
          if (result) {
            if (listPath !== undefined && listPath !== '' && listIndex !== null && !isNaN(listIndex)) {
              const arr = getByPath(content, listPath);
              if (arr && arr[listIndex]) arr[listIndex][listKey] = result;
            } else if (path) setByPath(content, path, result);
            scheduleSave();
            toast('Uploaded — now click "Publish to GitHub"', 'success');
            renderSection(currentSection);
          } else {
            btn.disabled = false;
            btn.innerHTML = originalHTML;
          }
        } catch(e) {
          toast('Upload failed: ' + e.message, 'error');
          btn.disabled = false;
          btn.innerHTML = originalHTML;
        }
      });
      input.click();
    });
  }

  function scheduleSave() {
    setStatus('warn', 'Saving...');
    clearTimeout(saveTimeout);
    saveTimeout = setTimeout(() => {
      try {
        localStorage.setItem(LS_KEY, JSON.stringify(content));
        setStatus('ok', 'Saved locally');
      } catch (e) {
        setStatus('err', 'Save failed');
        toast('Could not save: ' + e.message, 'error');
      }
    }, 400);
  }

  function setStatus(kind, text) {
    const dot = document.getElementById('saveStatus');
    if (!dot) return;
    dot.className = 'status-dot' + (kind === 'warn' ? ' warn' : kind === 'err' ? ' err' : '');
    const label = document.getElementById('saveStatusText');
    if (label) label.textContent = text;
  }

  function bindTopbar() {
    document.getElementById('btnPreview').addEventListener('click', () => {
      localStorage.setItem(LS_KEY, JSON.stringify(content));
      toast('Saved locally. Opening preview...', 'info');
      window.open('../index.html?preview=1', '_blank');
    });
    document.getElementById('btnReset').addEventListener('click', () => {
      confirmAction('Discard all local changes?', 'This will delete everything you have edited but not yet exported.', () => {
        localStorage.removeItem(LS_KEY);
        content = JSON.parse(JSON.stringify(DEFAULT_CONTENT));
        renderSection(currentSection);
        toast('Reset to defaults', 'success');
      });
    });
    document.getElementById('btnDownload').addEventListener('click', downloadJSON);
    document.getElementById('btnPublish').addEventListener('click', () => {
      document.getElementById('publishModal').classList.add('is-open');
    });
  }

  function downloadJSON() {
    const blob = new Blob([JSON.stringify(content, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'content.json';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    toast('content.json downloaded — commit it to your repo', 'success');
  }

  function bindPublishModal() {
    const modal = document.getElementById('publishModal');
    document.getElementById('publishCancel').addEventListener('click', () => modal.classList.remove('is-open'));
    modal.addEventListener('click', e => { if (e.target === modal) modal.classList.remove('is-open'); });
    document.getElementById('publishConfirm').addEventListener('click', publishToGitHub);
    ['ghRepo','ghBranch','ghPath','ghToken','ghMessage'].forEach(id => document.getElementById(id).addEventListener('change', saveGitHubConfig));
  }

  function loadGitHubConfig() {
    try {
      const cfg = JSON.parse(localStorage.getItem(LS_GH) || '{}');
      const map = { repo: 'ghRepo', branch: 'ghBranch', path: 'ghPath', token: 'ghToken', message: 'ghMessage' };
      for (const [k, id] of Object.entries(map)) {
        const el = document.getElementById(id);
        if (el && cfg[k]) el.value = cfg[k];
      }
    } catch (e) {}
  }

  function saveGitHubConfig() {
    const cfg = {
      repo: document.getElementById('ghRepo').value.trim(),
      branch: document.getElementById('ghBranch').value.trim(),
      path: document.getElementById('ghPath').value.trim(),
      token: document.getElementById('ghToken').value.trim(),
      message: document.getElementById('ghMessage').value.trim()
    };
    localStorage.setItem(LS_GH, JSON.stringify(cfg));
  }

  async function publishToGitHub() {
    const repo = document.getElementById('ghRepo').value.trim();
    const branch = document.getElementById('ghBranch').value.trim() || 'main';
    const path = document.getElementById('ghPath').value.trim() || 'content.json';
    const token = document.getElementById('ghToken').value.trim();
    const message = document.getElementById('ghMessage').value.trim() || 'Update site content';
    if (!repo || !token) { toast('Repository and token are required', 'error'); return; }
    if (!/^[^/]+\/[^/]+$/.test(repo)) { toast('Repository must be in owner/repo format', 'error'); return; }
    const btn = document.getElementById('publishConfirm');
    btn.disabled = true;
    btn.textContent = 'Publishing...';
    try {
      const getUrl = `https://api.github.com/repos/${repo}/contents/${path}?ref=${branch}`;
      let sha = null;
      const getRes = await fetch(getUrl, { headers: { 'Authorization': `Bearer ${token}`, 'Accept': 'application/vnd.github+json' } });
      if (getRes.ok) { const j = await getRes.json(); sha = j.sha; }
      else if (getRes.status !== 404) { throw new Error(`Cannot read current file (${getRes.status})`); }
      const contentStr = JSON.stringify(content, null, 2);
      const encoded = btoa(unescape(encodeURIComponent(contentStr)));
      const putRes = await fetch(`https://api.github.com/repos/${repo}/contents/${path}`, {
        method: 'PUT',
        headers: { 'Authorization': `Bearer ${token}`, 'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json' },
        body: JSON.stringify({ message, content: encoded, branch, ...(sha ? { sha } : {}) })
      });
      if (!putRes.ok) {
        const err = await putRes.json().catch(() => ({}));
        throw new Error(err.message || `GitHub returned ${putRes.status}`);
      }
      toast('Published! Pages will rebuild in ~1 minute', 'success');
      document.getElementById('publishModal').classList.remove('is-open');
    } catch (e) {
      toast('Publish failed: ' + e.message, 'error');
    } finally {
      btn.disabled = false;
      btn.textContent = 'Publish Now';
    }
  }

  let confirmCallback = null;
  function confirmAction(title, text, onOk) {
    document.getElementById('confirmTitle').textContent = title;
    document.getElementById('confirmText').textContent = text;
    document.getElementById('confirmModal').classList.add('is-open');
    confirmCallback = onOk;
  }
  document.getElementById('confirmCancel').addEventListener('click', () => { document.getElementById('confirmModal').classList.remove('is-open'); confirmCallback = null; });
  document.getElementById('confirmOk').addEventListener('click', () => { if (confirmCallback) confirmCallback(); document.getElementById('confirmModal').classList.remove('is-open'); confirmCallback = null; });

  function toast(message, kind) {
    kind = kind || 'info';
    const stack = document.getElementById('toastStack');
    const el = document.createElement('div');
    el.className = 'toast toast--' + kind;
    const icons = {
      success: '<polyline points="20 6 9 17 4 12"/>',
      error: '<circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/>',
      info: '<circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/>'
    };
    el.innerHTML = `<svg class="toast__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${icons[kind]}</svg><span>${esc(message)}</span>`;
    stack.appendChild(el);
    setTimeout(() => {
      el.style.transition = '.3s cubic-bezier(.22,.61,.36,1)';
      el.style.opacity = '0';
      el.style.transform = 'translateY(10px)';
      setTimeout(() => el.remove(), 300);
    }, 3500);
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
  else init();
})();
</script>
</body>
</html>
